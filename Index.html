<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
     <link rel="stylesheet" href="style.css">
    <title>Isi Sendiri</title>
  </head>
  <body>
    <input type="text" id="layar" readonly>

    <div class="kotak-besar">
      <button class="HapusSemua" onclick="HapusSemua()">C</button>
      <button class="BackSpace" onclick="BackSpace('⌫')">⌫</button>
      <button class="operator" onclick="TambahKeLayar('%')">%</button>
      <button class="operator" onclick="TambahKeLayar('/')">÷</button>
      <button class="operator" onclick="TambahKeLayar('7')">7</button>
      <button class="operator" onclick="TambahKeLayar('8')">8</button>
      <button class="operator" onclick="TambahKeLayar('9')">9</button>
      <button class="operator" onclick="TambahKeLayar('*')">X</button>
      <button class="operator" onclick="TambahKeLayar('4')">4</button>
      <button class="operator" onclick="TambahKeLayar('5')">5</button>
      <button class="operator" onclick="TambahKeLayar('6')">6</button>
      <button class="operator" onclick="TambahKeLayar('-')">-</button>
      <button class="operator" onclick="TambahKeLayar('1')">1</button>
      <button class="operator" onclick="TambahKeLayar('2')">2</button>
      <button class="operator" onclick="TambahKeLayar('3')">3</button>
      <button class="operator" onclick="TambahKeLayar('+')">+</button>
      <button class="LebarDua" onclick="TambahKeLayar('0')">0</button>
      <button class="operator" onclick="TambahKeLayar(',')">,</button>
      <button class="HitungNilai" onclick="HitungNilai('=')">=</button>
    </div>

   <script src="script.js"></script>
  </body>
</html>
